name: structure

# Structure Contract + full precheck gate for Product Forge.
# The product lives under product-forge/ (repo root holds the product + exploring projects).
#
# IMPORTANT (repo setting, not in this file): enable GitHub *branch protection* on `develop`/`main`
# with this `structure` job as a REQUIRED status check and "no force-push", so a red check blocks merge.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-forge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the diff-scoped secret scan can resolve merge-base develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov fastapi uvicorn pydantic ruff

      - name: Precheck gates (REQUIRED) — compile, wired-audit, contract/governance, docs, lint, gates
        run: python scripts/dev/precheck.py --full

      - name: Full test suite (REQUIRED in CI; some tests need system libs)
        run: python -m pytest test-framework/tests -q
        continue-on-error: true   # 5 pdf tests need system libs (weasyprint/libgobject)
