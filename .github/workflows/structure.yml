name: structure

# Structure Contract + FAST precheck gate for Product Forge (the per-change gate).
# The FULL sweep (all gates + the full test suite) runs in .github/workflows/full-sweep.yml on a schedule,
# OUT of the per-change critical path, so a single change pays only targeted checks here (BI-PF-1336).
# The product lives under product-forge/ (repo root holds the product + exploring projects).
#
# IMPORTANT (repo setting, not in this file): enable GitHub *branch protection* on `develop`/`main`
# with this `structure` job as a REQUIRED status check and "no force-push", so a red check blocks merge.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    env:
      # CI has no shared git-CAS authority (id or lease) to push; strict mode fails closed. Use soft mode in CI.
      PF_ID_ALLOC: "on"
      PF_LEASE_REMOTE: "on"
    defaults:
      run:
        working-directory: product-forge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the diff-scoped secret scan can resolve merge-base develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Go toolchain: the pfcore/contract Go engine + the wg-go / artifact-contracts checks need `go` on PATH.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Configure git identity
        run: |
          git config --global user.email "ci@productforge.local"
          git config --global user.name "Product Forge CI"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov fastapi uvicorn pydantic ruff
          pip install httpx requests pyyaml jsonschema

      - name: Precheck gates (REQUIRED; fast/targeted tier)
        run: python scripts/dev/precheck.py
