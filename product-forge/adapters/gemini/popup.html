<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Factory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0c;
      color: #e8e6e3;
      font-size: 13px;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #2a2a30;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #f97316;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #000;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
    }
    .subtitle {
      font-size: 11px;
      color: #7a7a80;
    }
    .section {
      padding: 16px;
      border-bottom: 1px solid #2a2a30;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7a7a80;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      color: #7a7a80;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #2a2a30;
      border-radius: 6px;
      background: #121215;
      color: #e8e6e3;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus, .form-select:focus {
      border-color: #f97316;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: #f97316;
      color: #000;
    }
    .btn-primary:hover {
      background: #ea6c0a;
    }
    .btn-primary:disabled {
      background: #2a2a30;
      color: #7a7a80;
      cursor: not-allowed;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .status-success {
      background: #1a2e1a;
      color: #22c55e;
      border: 1px solid #22c55e;
    }
    .status-error {
      background: #2e1a1a;
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .status-info {
      background: #1a1a2e;
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }
    .sent-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .sent-item {
      padding: 8px;
      border-bottom: 1px solid #2a2a30;
      font-size: 11px;
    }
    .sent-item:last-child {
      border-bottom: none;
    }
    .sent-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    .sent-meta {
      color: #7a7a80;
    }
    .settings-link {
      display: block;
      text-align: center;
      color: #7a7a80;
      font-size: 11px;
      padding: 12px;
      cursor: pointer;
    }
    .settings-link:hover {
      color: #f97316;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2a2a30;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PF</div>
    <div>
      <div class="title">Product Factory</div>
      <div class="subtitle">Send to Factory</div>
    </div>
  </div>

  <div class="section" id="send-section">
    <div class="section-title">Send Conversation</div>
    
    <div class="form-group">
      <label class="form-label">Intent</label>
      <select class="form-select" id="intent">
        <option value="save_idea">Save as Idea</option>
        <option value="new_project">New Project</option>
        <option value="new_project_quick">Quick Prototype</option>
        <option value="modify_project">Modify Project</option>
        <option value="add_context">Add Context</option>
      </select>
    </div>

    <div class="form-group" id="project-name-group" style="display:none">
      <label class="form-label">Project Name</label>
      <input class="form-input" id="project-name" placeholder="my-project">
    </div>

    <div class="form-group" id="target-project-group" style="display:none">
      <label class="form-label">Target Project</label>
      <select class="form-select" id="target-project">
        <option value="">Loading projects...</option>
      </select>
    </div>

    <div id="status-container"></div>

    <button class="btn btn-primary" id="send-btn" onclick="sendConversation()">
      Send to Factory
    </button>
  </div>

  <div class="section">
    <div class="section-title">Recently Sent</div>
    <div class="sent-list" id="sent-list">
      <div style="color: #7a7a80; text-align: center; padding: 20px;">No conversations sent yet</div>
    </div>
  </div>

  <div class="settings-link" onclick="openSettings()">Settings</div>

  <script src="popup.js"></script>
</body>
</html>
