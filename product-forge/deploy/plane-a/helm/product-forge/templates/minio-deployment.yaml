{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "product-forge.fullname" . }}-minio
  labels:
    {{- include "product-forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "product-forge.name" . }}-minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "product-forge.name" . }}-minio
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: objectstore
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: {{ .Values.minio.service.port }}
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "product-forge.fullname" . }}-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: {{ include "product-forge.fullname" . }}-minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "product-forge.fullname" . }}-minio-pvc
  labels:
    {{- include "product-forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
  annotations:
    helm.sh/resource-policy: keep
    platform.productforge.io/reclaim-policy: Retain
spec:
  accessModes: [ "ReadWriteOnce" ]
  {{- if .Values.minio.persistence.storageClass }}
  storageClassName: {{ .Values.minio.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
{{- end }}
