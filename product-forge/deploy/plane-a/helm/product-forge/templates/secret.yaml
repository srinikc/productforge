apiVersion: v1
kind: Secret
metadata:
  name: {{ include "product-forge.fullname" . }}-secrets
  labels:
    {{- include "product-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  PF_EDP_TOKEN: {{ .Values.secrets.edpToken | quote }}
  PF_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  PF_HMAC_SECRET: {{ .Values.secrets.hmacSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
