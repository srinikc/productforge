# Local PostgreSQL for Product Forge's system of record (EDP-17 / BI-PF-1309).
#
#   docker compose -f docker-compose.edp.yml up -d
#   $env:PF_DB_DSN = "postgres://pf_owner:pf_owner@localhost:5432/productforge?sslmode=disable"
#   python scripts/dev/db_bootstrap.py            # bootstrap (roles + migrations), tooling-only
#
# This is the SoR instance; the git-remote/API id authority and the object store are separate.
services:
  postgres:
    image: postgres:16
    container_name: pf-edp-postgres
    environment:
      POSTGRES_USER: pf_owner
      POSTGRES_PASSWORD: pf_owner
      POSTGRES_DB: productforge
    ports:
      - "5432:5432"
    volumes:
      - pf_edp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf_owner -d productforge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pf_edp_pgdata:
