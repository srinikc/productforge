global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - backlog-authority.rules.yml

scrape_configs:
  - job_name: edpsvc
    metrics_path: /metrics
    scheme: http
    authorization:
      credentials_file: /etc/prometheus/edp-admin-token
    static_configs:
      - targets: ["edpsvc:8030"]
