[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-forge"
version = "2.0.0"
description = "Multi-Agent Multi-Project System - Product Forge"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Product Forge Team", email = "team@productforge.ai"}
]
maintainers = [
    {name = "Product Forge Team", email = "team@productforge.ai"}
]
keywords = [
    "multi-agent",
    "pipeline",
    "orchestration",
    "workflow",
    "documentation",
    "dashboard",
    "product-development"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
pdf = [
    "weasyprint>=60.0",
    "playwright>=1.40.0",
]
all = ["weasyprint>=60.0", "playwright>=1.40.0", "pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
productforge = "core.main:main"

[project.urls]
Homepage = "https://github.com/productforge/productforge"
Repository = "https://github.com/productforge/productforge"
Documentation = "https://github.com/productforge/productforge/blob/main/README.md"
Issues = "https://github.com/productforge/productforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "pipeline_dashboard*"]

[tool.setuptools.package-dir]
"core" = "core"
"pipeline_dashboard" = "pipeline_dashboard"

[tool.pytest.ini_options]
testpaths = ["test-framework"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true