# Compliance Configuration
# Rules and requirements by product domain

# Product domain to compliance mapping
domains:
  finance:
    regulations:
      - name: "PCI-DSS"
        version: "4.0"
        description: "Payment Card Industry Data Security Standard"
        requirements:
          - encryption_at_rest: true
          - encryption_in_transit: true
          - access_control: "RBAC"
          - audit_logging: true
          - network_segmentation: true
          - vulnerability_scanning: "quarterly"
          - penetration_testing: "annual"
          
      - name: "SOC2"
        version: "Type II"
        description: "Service Organization Control 2"
        requirements:
          - security: true
          - availability: true
          - processing_integrity: true
          - confidentiality: true
          - privacy: true
          
      - name: "SOX"
        version: "2002"
        description: "Sarbanes-Oxley Act"
        requirements:
          - financial_reporting_controls: true
          - audit_trail: true
          - data_retention: "7 years"
          
    security_requirements:
      - encryption_algorithm: "AES-256"
      - key_management: "HSM or KMS"
      - mfa_required: true
      - session_timeout_minutes: 15
      - password_complexity: "high"

  healthcare:
    regulations:
      - name: "HIPAA"
        version: "2013"
        description: "Health Insurance Portability and Accountability Act"
        requirements:
          - phi_protection: true
          - audit_logging: true
          - access_control: "RBAC"
          - encryption: "AES-256"
          - breach_notification: "60 days"
          - business_associate_agreements: true
          
      - name: "HITECH"
        version: "2009"
        description: "Health Information Technology for Economic and Clinical Health Act"
        requirements:
          - breach_notification: "60 days"
          - encryption_safe_harbor: true
          - audit_controls: true
          
    security_requirements:
      - minimum_necessary_access: true
      - auto_logoff: true
      - emergency_access: true
      - data_integrity: true
      - transmission_security: true

  ecommerce:
    regulations:
      - name: "PCI-DSS"
        version: "4.0"
        description: "Payment Card Industry Data Security Standard"
        requirements:
          - cardholder_data_protection: true
          - encryption_in_transit: true
          - access_control: true
          - vulnerability_management: true
          
      - name: "GDPR"
        version: "2018"
        description: "General Data Protection Regulation"
        requirements:
          - consent_management: true
          - right_to_erasure: true
          - data_portability: true
          - privacy_by_design: true
          - data_protection_officer: "if >250 employees"
          
      - name: "CCPA"
        version: "2020"
        description: "California Consumer Privacy Act"
        requirements:
          - right_to_know: true
          - right_to_delete: true
          - right_to_opt_out: true
          - non_discrimination: true
          
    security_requirements:
      - pii_protection: true
      - payment_tokenization: true
      - fraud_detection: true
      - session_management: true

  education:
    regulations:
      - name: "FERPA"
        version: "1974"
        description: "Family Educational Rights and Privacy Act"
        requirements:
          - student_data_protection: true
          - parent_access_rights: true
          - directory_information_control: true
          - breach_notification: true
          
    security_requirements:
      - role_based_access: true
      - audit_logging: true
      - data_minimization: true

  government:
    regulations:
      - name: "FISMA"
        version: "2014"
        description: "Federal Information Security Management Act"
        requirements:
          - security_categorization: true
          - security_controls: "NIST 800-53"
          - continuous_monitoring: true
          - incident_response: true
          
      - name: "FedRAMP"
        version: "5.0"
        description: "Federal Risk and Authorization Management Program"
        requirements:
          - security_assessment: true
          - authorization: true
          - continuous_monitoring: true
          - incident_response: "24 hours"
          
    security_requirements:
      - fips_140_2: true
      - encrypted_at_rest: true
      - encrypted_in_transit: true
      - access_control: "RBAC + ABAC"
      - audit_immutable: true

  social:
    regulations:
      - name: "GDPR"
        version: "2018"
        description: "General Data Protection Regulation"
        requirements:
          - consent_management: true
          - right_to_erasure: true
          - data_portability: true
          
      - name: "CCPA"
        version: "2020"
        description: "California Consumer Privacy Act"
        requirements:
          - right_to_know: true
          - right_to_delete: true
          
    security_requirements:
      - pii_protection: true
      - content_moderation: true
      - harassment_prevention: true

  iot:
    regulations:
      - name: "FDA"
        version: "2023"
        description: "FDA IoT Cybersecurity Guidance"
        requirements:
          - secure_by_design: true
          - vulnerability_disclosure: true
          - software_bill_of_materials: true
          
    security_requirements:
      - device_authentication: true
      - encrypted_communication: true
      - secure_boot: true
      - firmware_updates: true

  ai_ml:
    regulations:
      - name: "EU AI Act"
        version: "2024"
        description: "European Union Artificial Intelligence Act"
        requirements:
          - risk_assessment: true
          - transparency: true
          - human_oversight: true
          - data_governance: true
          
    security_requirements:
      - model_security: true
      - data_privacy: true
      - adversarial_robustness: true
      - explainability: true

  blockchain:
    regulations:
      - name: "MiCA"
        version: "2024"
        description: "Markets in Crypto-Assets Regulation"
        requirements:
          - regulatory_compliance: true
          - aml_kyc: true
          - consumer_protection: true
          
    security_requirements:
      - smart_contract_audit: true
      - key_management: true
      - consensus_security: true

  productivity:
    regulations: []
    security_requirements:
      - authentication: true
      - authorization: true
      - data_encryption: true

  gaming:
    regulations:
      - name: "COPPA"
        version: "1998"
        description: "Children's Online Privacy Protection Act"
        requirements:
          - age_verification: true
          - parental_consent: true
          - data_minimization: true
          
    security_requirements:
      - anti_cheat: true
      - secure_multiplayer: true
      - virtual_economy_security: true

  general:
    regulations: []
    security_requirements:
      - authentication: true
      - authorization: true
      - input_validation: true
      - error_handling: true

# Product type to security level mapping
product_types:
  exploration:
    security_level: "minimal"
    scan_depth: "basic"
    compliance_check: false
    
  learning:
    security_level: "basic"
    scan_depth: "basic"
    compliance_check: false
    
  fun:
    security_level: "basic"
    scan_depth: "basic"
    compliance_check: false
    
  prototype:
    security_level: "standard"
    scan_depth: "standard"
    compliance_check: false
    
  personal:
    security_level: "standard"
    scan_depth: "standard"
    compliance_check: false
    
  internal:
    security_level: "standard"
    scan_depth: "standard"
    compliance_check: true
    
  product:
    security_level: "high"
    scan_depth: "comprehensive"
    compliance_check: true
    
  business:
    security_level: "maximum"
    scan_depth: "comprehensive"
    compliance_check: true
