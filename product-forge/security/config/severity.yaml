# Severity Definitions
# Standardized severity levels for security findings

severity_levels:
  critical:
    cvss_range: "9.0-10.0"
    description: "Remote code execution, data breach, system compromise"
    fix_timeline: "Immediate"
    business_impact: "Severe"
    examples:
      - "Remote code execution"
      - "SQL injection with data exfiltration"
      - "Authentication bypass"
      - "Privilege escalation to admin"
      - "Complete system compromise"
    
  high:
    cvss_range: "7.0-8.9"
    description: "Privilege escalation, significant data exposure"
    fix_timeline: "Within 1-2 weeks"
    business_impact: "High"
    examples:
      - "Stored XSS with session hijacking"
      - "Insecure direct object reference"
      - "Sensitive data exposure"
      - "Broken access control"
      - "Cryptographic weaknesses"
    
  medium:
    cvss_range: "4.0-6.9"
    description: "Limited impact, requires specific conditions"
    fix_timeline: "Within 1 month"
    business_impact: "Medium"
    examples:
      - "Reflected XSS"
      - "CSRF with limited impact"
      - "Information disclosure"
      - "Insecure configuration"
      - "Missing security headers"
    
  low:
    cvss_range: "0.1-3.9"
    description: "Minimal impact, defense-in-depth"
    fix_timeline: "Track for future"
    business_impact: "Low"
    examples:
      - "Verbose error messages"
      - "Missing HTTPOnly flag"
      - "Deprecated algorithm usage"
      - "Minor information leakage"
    
  info:
    cvss_range: "0.0"
    description: "Best practice deviation, no direct vulnerability"
    fix_timeline: "Optional"
    business_impact: "None"
    examples:
      - "Code quality issues"
      - "Best practice recommendations"
      - "Documentation improvements"

# Priority definitions
priority_levels:
  p0:
    name: "Fix Now"
    description: "Blocking release, must fix immediately"
    timeline: "Immediate"
    sla_hours: 4
    
  p1:
    name: "Fix This Sprint"
    description: "High risk, fix within current sprint"
    timeline: "Within 1-2 weeks"
    sla_hours: 168
    
  p2:
    name: "Fix Next Sprint"
    description: "Medium risk, schedule for next sprint"
    timeline: "Within 1 month"
    sla_hours: 720
    
  p3:
    name: "Track"
    description: "Low risk, accept or defer"
    timeline: "Ongoing"
    sla_hours: null

# OWASP Top 10:2025 mapping
owasp_top_10:
  A01:
    name: "Broken Access Control"
    description: "Restrictions on what authenticated users are allowed to do are not properly enforced"
    severity_boost: "high"
    
  A02:
    name: "Security Misconfiguration"
    description: "Missing appropriate security hardening across any part of the application"
    severity_boost: "medium"
    
  A03:
    name: "Software Supply Chain Failures"
    description: "Vulnerable and outdated components, compromised dependencies"
    severity_boost: "high"
    
  A04:
    name: "Cryptographic Failures"
    description: "Failures related to cryptography which often leads to sensitive data exposure"
    severity_boost: "high"
    
  A05:
    name: "Injection"
    description: "User-supplied data is not validated, filtered, or sanitized by the application"
    severity_boost: "critical"
    
  A06:
    name: "Insecure Design"
    description: "Risks related to design flaws, missing or ineffective security controls"
    severity_boost: "medium"
    
  A07:
    name: "Authentication Failures"
    description: "Confirmation of the user's identity, authentication, and session management"
    severity_boost: "high"
    
  A08:
    name: "Software or Data Integrity Failures"
    description: "Code and infrastructure that does not protect against integrity violations"
    severity_boost: "medium"
    
  A09:
    name: "Logging and Alerting Failures"
    description: "Insufficient logging, detection, monitoring, and active response"
    severity_boost: "low"
    
  A10:
    name: "Mishandling of Exceptional Conditions"
    description: "Missing or ineffective error handling that can lead to information disclosure"
    severity_boost: "low"

