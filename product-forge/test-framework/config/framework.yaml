# Test Framework Configuration
# Global settings for the test automation framework

framework:
  name: "Pipeline Test Framework"
  version: "1.0.0"
  description: "Multi-project test automation framework for pipeline-generated products"

# Dashboard settings
dashboard:
  host: "0.0.0.0"
  port: 3011
  auto_refresh: 30  # seconds
  secret_key: "change-in-production"
  session_timeout: 3600  # 1 hour

# Authentication
auth:
  enabled: true
  admin_user: "admin"
  admin_password: "admin123"  # Change on first login
  max_login_attempts: 5
  lockout_duration: 300  # seconds

# Test execution settings
execution:
  default_timeout: 300  # 5 minutes
  parallel_workers: 4
  retry_count: 2
  retry_delay: 5  # seconds
  screenshot_on_failure: true
  video_on_failure: false
  capture_logs: true

# Deployment settings
deployment:
  docker_enabled: true
  local_enabled: true
  auto_uninstall: false  # Default: keep product installed
  health_check_timeout: 60  # seconds
  health_check_interval: 5  # seconds
  startup_wait: 10  # seconds

# Playwright settings
playwright:
  mcp_enabled: true
  browsers: ["chromium"]
  headless: true
  slow_mo: 0
  viewport:
    width: 1280
    height: 720

# RCCA settings
rcca:
  auto_update_agents: true
  agents_path: "../.opencode/agent"
  confidence_threshold: 0.5

# Reporting
reporting:
  output_dir: "reports"
  formats: ["json", "html"]
  retention_days: 90

# Defect tracking
defects:
  output_dir: "defects"
  auto_rcca: true
  severity_levels: ["critical", "high", "medium", "low"]

# Logging
logging:
  level: "INFO"
  file: "test-framework.log"
  max_size: 10  # MB
  backup_count: 5
