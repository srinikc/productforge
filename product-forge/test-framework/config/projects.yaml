  myworld:
    deployment:
      health_check: http://localhost:3000
      install: npm install
      method: local
      requirements:
        node: '>=18'
        npm: '>=9'
      start: npm run dev
      stop: pkill -f 'next dev'
    domain: productivity
    features:
    - id: search
      name: Search Functionality
      priority: high
      tests:
      - test_search_api.py
      - test_search_ui.py
    - id: todo
      name: ToDo Management
      priority: high
      tests:
      - test_todo_api.py
      - test_todo_ui.py
    - id: calendar
      name: Calendar Integration
      priority: medium
      tests:
      - test_calendar_api.py
      - test_calendar_ui.py
    - id: reminders
      name: Reminders System
      priority: medium
      tests:
      - test_reminders_api.py
      - test_reminders_ui.py
    - id: auth
      name: Authentication
      priority: high
      tests:
      - test_auth.py
    - id: dashboard
      name: Dashboard
      priority: high
      tests:
      - test_dashboard.py
    name: MyWorld
    path: ../products/myworld
    test_categories:
      api: true
      e2e: true
      install: false
      integration: true
      performance: false
      security: false
      unit: true
      visual: true
    type: product
