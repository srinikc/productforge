[pytest]
# Pipeline Test Configuration
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    security: Security system tests
    pipeline: End-to-end pipeline tests
    slow: Tests that take a long time
    concurrent: Tests for concurrent execution

# Options
addopts = 
    -v
    --tb=short
    --strict-markers
    -x

# Timeout (requires the pytest-timeout plugin; omit when absent to avoid a config warning)
# timeout = 300

# NOTE: one remaining warning is a third-party deprecation we do not control and cannot safely fix now
# (Starlette TestClient recommends httpx2; upgrading is risky on Python 3.14). Left visible on purpose;
# revisit when upgrading the FastAPI/Starlette stack. Our own code is lint-clean (ruff: 0).
